        required: true
        schema:
          type: string
      - description: 'Pagination offset (default: 0)'
        in: query
        name: offset
        required: false
        schema:
          format: int32
          minimum: 0
          type: integer
      - description: 'Pagination limit (default: 20)'
        in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      - description: 'Field to sort by (default: version)'
        in: query
        name: sortField
        required: false
        schema:
          type: string
      - description: 'Sort order: asc or desc (default: desc)'
        in: query
        name: sortOrder
        required: false
        schema:
          type: string
      - description: CVSS severity filter (e.g., critical, high) - repeatable
        in: query
        name: severities
        required: false
        schema:
          items:
            type: string
          type: array
      - description: Minimum CVSS score (0.0 to 10.0)
        in: query
        name: minCvss
        required: false
        schema:
          format: double
          type: number
      - description: Maximum CVSS score (0.0 to 10.0)
        in: query
        name: maxCvss
        required: false
        schema:
          format: double
          type: number
      - description: Minimum version score (0 to 100)
        in: query
        name: minVersionScore
        required: false
        schema:
          format: int32
          type: integer
      - description: Maximum version score (0 to 100)
        in: query
        name: maxVersionScore
        required: false
        schema:
          format: int32
          type: integer
      - description: Filter versions by version prefix (e.g., '2.10' matches '2.10.0',
          '2.10.1', '2.10-RC1')
        in: query
        name: versionQuery
        required: false
        schema:
          type: string
      - description: Time window for published date (e.g., 7d, 30d, 60d, 90d, 6m,
          1y, 2y)
        in: query
        name: publishedWindow
        required: false
        schema:
          type: string
      - description: Malware filter (true=has malware, false=no malware)
        in: query
        name: hasMalware
        required: false
        schema:
          type: boolean
      - description: Stable version filter (true=stable only, false=pre-release only,
          null=all)
        in: query
        name: isStable
        required: false
        schema:
          type: boolean
      - description: Package format (e.g., maven, npm, pypi)
        in: query
        name: format
        required: true
        schema:
          type: string
      - description: Package namespace/groupId (optional)
        in: query
        name: namespace
        required: false
        schema:
          type: string
      - description: Package name
        in: query
        name: name
        required: true
        schema:
          type: string
      - description: Package version to exclude from results
        in: query
        name: version
        required: true
        schema:
          type: string
      - description: Artifact extension (e.g., jar, war, pom)
        in: query
        name: extension
        required: false
        schema:
          type: string
      - description: Artifact classifier (e.g., sources, javadoc)
        in: query
        name: classifier
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiSearchResponse'
          description: Component versions found
        '400':
          content:
            '*/*':
