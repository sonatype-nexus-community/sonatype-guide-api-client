      - Usage
  /usage/cumulative:
    get:
      description: Retrieves daily credit usage with cumulative totals and statistics
        for the specified billing period. Includes total credits used, daily average,
        peak day, and credit limit. Supports both FREE and PAID users.
      operationId: getCumulativeUsage
      parameters:
      - description: Start date (YYYY-MM-DD)
        example: '2025-10-10'
        in: query
        name: startDate
        required: true
        schema:
          format: date
          type: string
      - description: End date (YYYY-MM-DD)
        example: '2025-11-09'
        in: query
        name: endDate
        required: true
        schema:
          format: date
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                billingPeriod:
                  endDate: '2025-11-09'
                  startDate: '2025-10-10'
                creditLimit: 5000
                dailyAverage: 194
                dailyUsage:
                - cumulativeUsage: 178
                  dailyUsage: 178
                  date: '2025-10-10'
                - cumulativeUsage: 381
                  dailyUsage: 203
                  date: '2025-10-11'
                peakDay: 248
                totalCreditsUsed: 6004
          description: Credit usage retrieved successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CumulativeCreditUsage'
          description: Invalid date format
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CumulativeCreditUsage'
          description: Subscription not found
      security:
      - bearer-jwt: []
      summary: Get cumulative credit usage for a billing period
      tags:
      - Usage
  /usage/ossi-history:
    get:
      description: Retrieves pre-migration OSSI API usage data aggregated by month.
        Shows estimated Guide credits based on historical unique component queries.
        Only available for OSSI-origin users.
      operationId: getOssiUsageHistory
      responses:
        '200':
          content:
            application/json:
              example:
                isEstimate: true
                months:
                - estimatedCredits: 1523.4
                  month: 2025-12
                  totalComponents: 15234
                summary:
                  dataRange:
                    end: 2025-12
                    start: 2025-01
                  monthlyAverage: 1523.4
                  totalCredits: 18280.8
          description: OSSI usage history retrieved successfully
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OssiUsageHistoryDTO'
          description: User not found or not an OSSI-origin user
      security:
      - bearer-jwt: []
      summary: Get historical OSSI usage
      tags:
      - Usage
