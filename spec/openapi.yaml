  /api/v3/authorized/component-report:
    post:
      description: 'Retrieves component reports for multiple Package URLs (PURLs)
        in a single request.


        Authentication:

        - HTTP Basic Authentication required

        - Authorization header: Basic <base64(username:apiToken)>


        Request Body:

        - Array of PURLs (max 128 components)

        - Each PURL must include a version


        Response Headers:

        - X-Batch-Size: Total number of components requested

        - X-Batch-Found: Number of components found

        - X-Credits-Used: Credits consumed for this request

        - X-Credits-Remaining: Available credit balance

        - X-Credits-Warning: Alert when approaching credit limit (JSON)


        Note: Credits are only charged for components found. Requests for the same

        components on the same day are not charged multiple times.

        '
      operationId: getComponentReports_1
      parameters:
      - in: header
        name: User-Agent
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurlRequest_Post'
          application/vnd.ossindex.component-report-request.v1+json:
            schema:
              $ref: '#/components/schemas/PurlRequest_Post'
        required: true
      responses:
        '200':
          content:
            application/vnd.ossindex.component-report.v1+json:
              schema:
                items:
                  $ref: '#/components/schemas/ComponentReport_Post'
                type: array
          description: Component reports retrieved successfully
        '400':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ComponentReport_Post'
                type: array
            application/vnd.ossindex.component-report.v1+json:
              schema:
                items:
                  $ref: '#/components/schemas/ComponentReport_Post'
                type: array
          description: Invalid request - missing coordinates or invalid PURL format
        '401':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ComponentReport_Post'
                type: array
            application/vnd.ossindex.component-report.v1+json:
              schema:
                items:
                  $ref: '#/components/schemas/ComponentReport_Post'
                type: array
          description: Unauthorized - invalid credentials
        '402':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ComponentReport_Post'
                type: array
            application/vnd.ossindex.component-report.v1+json:
              schema:
                items:
                  $ref: '#/components/schemas/ComponentReport_Post'
                type: array
          description: Payment required - insufficient credits
        '500':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ComponentReport_Post'
                type: array
            application/vnd.ossindex.component-report.v1+json:
              schema:
                items:
                  $ref: '#/components/schemas/ComponentReport_Post'
                type: array
          description: Internal server error - OSSI service unavailable or other system
            error
      security:
      - ossi-basic-auth: []
      summary: Get component reports for multiple PURLs
      tags:
      - OSS Index Compatibility
